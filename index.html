<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natali Ghibradze</title>
  <style>
    :root{
      --bg:#0c1220;
      --bg-soft:#111a2c;
      --gold:#c9a24b;
      --text:#f2efe9;
      --text-dim:#a9b1c3;
      --line:#26314a;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:'Georgia','Times New Roman',serif;
    }
    .nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:24px 48px;
      border-bottom:1px solid var(--line);
      font-family:Arial,Helvetica,sans-serif;
    }
    .nav .brand{
      font-family:'Georgia',serif;
      font-size:1.25rem;
      letter-spacing:.02em;
    }
    .nav .links{
      display:flex;
      gap:28px;
      font-size:.72rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--text-dim);
    }
    .nav .links a{color:var(--text-dim);text-decoration:none;}
    .nav .links a:hover{color:var(--gold);}
    .nav .resume-btn{
      background:var(--gold);
      color:#1a1408;
      padding:10px 18px;
      font-size:.72rem;
      letter-spacing:.1em;
      text-transform:uppercase;
      font-weight:bold;
    }

    .hero{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:60px;
      padding:80px 48px 100px;
      max-width:1300px;
      margin:0 auto;
      flex-wrap:wrap;
    }
    .hero-text{flex:1 1 420px;min-width:320px;}
    .eyebrow{
      display:flex;
      align-items:center;
      gap:14px;
      font-family:Arial,Helvetica,sans-serif;
      font-size:.75rem;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--gold);
      margin-bottom:28px;
    }
    .eyebrow .rule{width:38px;height:1px;background:var(--gold);display:inline-block;}
    h1.name{
      margin:0;
      font-weight:400;
      font-style:italic;
      font-size:3.6rem;
      line-height:1.05;
    }
    h1.name .last{
      display:block;
      font-style:normal;
      font-weight:700;
      font-size:3.6rem;
    }
    .subline{
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text-dim);
      font-size:1rem;
      margin-top:28px;
    }
    .subline.langs{
      color:var(--gold);
      margin-top:6px;
    }
    .cta-row{
      display:flex;
      gap:14px;
      margin-top:38px;
      flex-wrap:wrap;
      font-family:Arial,Helvetica,sans-serif;
    }
    .btn{
      padding:15px 26px;
      font-size:.75rem;
      letter-spacing:.1em;
      text-transform:uppercase;
      text-decoration:none;
      cursor:pointer;
      border:1px solid var(--line);
      color:var(--text);
      background:transparent;
    }
    .btn.primary{
      background:var(--gold);
      color:#1a1408;
      font-weight:bold;
      border-color:var(--gold);
    }
    .btn:hover{border-color:var(--gold);}

    .hero-photo{
      flex:0 0 auto;
      width:340px;
      height:410px;
      border:1px solid var(--gold);
      padding:10px;
    }
    .hero-photo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    @media (max-width:700px){
      .nav .links{display:none;}
      h1.name, h1.name .last{font-size:2.6rem;}
      .hero{padding:48px 24px 64px;}
      .hero-photo{width:100%;height:340px;}
    }

    .stats{
      display:flex;
      flex-wrap:wrap;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      background:var(--bg-soft);
    }
    .stat{
      flex:1 1 180px;
      text-align:center;
      padding:40px 20px;
      border-right:1px solid var(--line);
    }
    .stat:last-child{border-right:none;}
    .stat-num{
      font-size:2.2rem;
      color:var(--gold);
      font-weight:700;
    }
    .stat-label{
      margin-top:8px;
      font-family:Arial,Helvetica,sans-serif;
      font-size:.68rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--text-dim);
    }
    @media (max-width:700px){
      .stat{flex:1 1 50%;border-bottom:1px solid var(--line);}
    }

    .about{
      max-width:1000px;
      margin:0 auto;
      padding:100px 48px 110px;
    }
    .about h2{
      font-size:2.6rem;
      font-weight:400;
      line-height:1.2;
      margin:0 0 40px;
    }
    .about h2 b{font-weight:700;}
    .about p{
      font-family:Arial,Helvetica,sans-serif;
      font-size:1.02rem;
      line-height:1.75;
      color:var(--text-dim);
      margin:0 0 24px;
      max-width:820px;
    }
    .quote-block{
      border-left:3px solid var(--gold);
      background:var(--bg-soft);
      padding:36px 40px;
      margin-top:48px;
    }
    .quote-block p{
      font-family:'Georgia',serif;
      font-style:italic;
      font-size:1.4rem;
      color:var(--text);
      margin:0 0 16px;
      line-height:1.5;
    }
    .quote-block .attribution{
      font-family:Arial,Helvetica,sans-serif;
      font-size:.75rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--gold);
    }
    @media (max-width:700px){
      .about{padding:64px 24px 72px;}
      .about h2{font-size:2rem;}
      .quote-block{padding:28px 24px;}
      .quote-block p{font-size:1.15rem;}
    }

    .cards-section{
      max-width:1200px;
      margin:0 auto;
      padding:20px 48px 110px;
    }
    .cards-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:24px;
      margin-top:20px;
    }
    .card{
      background:var(--bg-soft);
      border:1px solid var(--line);
      padding:32px 28px;
    }
    .card .icon{font-size:1.8rem;margin-bottom:18px;display:block;}
    .card h3{
      font-size:1.15rem;
      font-weight:700;
      margin:0 0 14px;
    }
    .card p{
      font-family:Arial,Helvetica,sans-serif;
      font-size:.92rem;
      line-height:1.65;
      color:var(--text-dim);
      margin:0;
    }
    @media (max-width:900px){
      .cards-grid{grid-template-columns:repeat(2,1fr);}
    }
    @media (max-width:700px){
      .cards-section{padding:0 24px 72px;}
      .cards-grid{grid-template-columns:1fr;}
    }

    .cs-section{
      max-width:1000px;
      margin:0 auto;
      padding:20px 48px 110px;
    }
    .cs-section h2{
      font-size:2.6rem;
      font-weight:400;
      line-height:1.2;
      margin:0;
    }
    .cs-section .section-sub{
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text-dim);
      font-size:.95rem;
      margin:16px 0 40px;
    }
    .cs-card{
      border:1px solid var(--line);
      background:var(--bg-soft);
      margin-bottom:18px;
      border-radius:4px;
      overflow:hidden;
      position:relative;
      padding-left:5px;
    }
    .cs-card::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      bottom:0;
      width:5px;
      background:rgb(196,74,74);
    }
    .cs-card.tag-blue::before{background:rgb(59,125,216);}
    .cs-tag.tag-blue{
      color:rgb(130,177,255);
      background:rgba(59,125,216,0.15);
      border-color:rgba(59,125,216,0.3);
    }
    .cs-card.tag-green::before{background:rgb(74,156,111);}
    .cs-tag.tag-green{
      color:rgb(128,203,196);
      background:rgba(74,156,111,0.15);
      border-color:rgba(74,156,111,0.3);
    }
    .cs-card.tag-purple::before{background:rgb(155,89,182);}
    .cs-tag.tag-purple{
      color:rgb(206,147,216);
      background:rgba(155,89,182,0.15);
      border-color:rgba(155,89,182,0.3);
    }
    .cs-card.tag-gold::before{background:rgb(196,151,74);}
    .cs-tag.tag-gold{
      color:rgb(232,185,106);
      background:rgba(196,151,74,0.15);
      border-color:rgba(196,151,74,0.3);
    }
    .cs-card summary{
      list-style:none;
      cursor:pointer;
      padding:26px 30px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }
    .cs-card summary::-webkit-details-marker{display:none;}
    .cs-tag{
      font-family:Arial,Helvetica,sans-serif;
      font-size:9px;
      font-weight:600;
      letter-spacing:1.26px;
      color:rgb(239,154,154);
      background:rgba(196,74,74,0.15);
      border:1px solid rgba(196,74,74,0.3);
      border-radius:2px;
      padding:4px 10px;
      display:inline-block;
      margin-bottom:12px;
    }
    .cs-title{
      font-size:1.15rem;
      font-weight:700;
      margin:0;
    }
    .cs-toggle{
      font-size:1.4rem;
      color:var(--gold);
      flex:0 0 auto;
    }
    .cs-card[open] .cs-toggle{transform:rotate(45deg);}
    .cs-body{
      padding:0 30px 30px;
      font-family:Arial,Helvetica,sans-serif;
    }
    .cs-body p{
      color:var(--text-dim);
      font-size:.95rem;
      line-height:1.7;
      margin:0 0 22px;
    }
    .cs-results{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
    .cs-results li{
      display:flex;
      align-items:flex-start;
      gap:10px;
      color:rgb(104,196,144);
      background:rgba(74,156,111,0.1);
      border:1px solid rgba(74,156,111,0.2);
      border-radius:3px;
      padding:10px 14px;
      font-size:.85rem;
      line-height:1.5;
    }
    .cs-results li::before{
      content:"\2192";
      color:rgb(74,156,111);
      font-weight:700;
      flex:0 0 auto;
    }
    @media (max-width:700px){
      .cs-section{padding:0 24px 72px;}
      .cs-card summary{padding:20px;}
      .cs-body{padding:0 20px 24px;}
    }

    .systems-section{
      max-width:1200px;
      margin:0 auto;
      padding:20px 48px 110px;
    }
    .systems-section h2{
      font-size:2.6rem;
      font-weight:400;
      line-height:1.2;
      margin:0;
    }
    .sys-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:24px;
      margin-top:20px;
    }
    .sys-card{
      background:var(--bg-soft);
      border:1px solid var(--line);
      border-radius:4px;
      padding:30px;
      transition:border-color .2s, transform .2s;
    }
    .sys-card:hover{border-color:rgba(196,151,74,.35);transform:translateY(-3px);}
    .sys-icon{font-size:28px;margin-bottom:16px;display:block;}
    .sys-icon-svg{line-height:0;}
    .sys-card h3{
      font-family:'Georgia',serif;
      font-size:19px;
      font-weight:600;
      margin:0 0 10px;
    }
    .sys-card p{
      font-family:Arial,Helvetica,sans-serif;
      font-size:13px;
      color:var(--text-dim);
      line-height:1.7;
      margin:0 0 18px;
    }
    .sys-metrics{
      display:flex;
      flex-direction:column;
      gap:7px;
      font-family:Arial,Helvetica,sans-serif;
    }
    .sys-metric{
      font-size:12px;
      font-weight:500;
      color:var(--gold);
      display:flex;
      gap:8px;
    }
    .sys-metric::before{
      content:"\2736";
      color:var(--gold);
      font-size:8px;
      flex-shrink:0;
      margin-top:3px;
    }
    @media (max-width:900px){
      .sys-grid{grid-template-columns:repeat(2,1fr);}
    }
    @media (max-width:700px){
      .systems-section{padding:0 24px 72px;}
      .sys-grid{grid-template-columns:1fr;}
    }

    .how-section{
      max-width:1200px;
      margin:0 auto;
      padding:20px 48px 110px;
    }
    .how-section h2{
      font-size:2.6rem;
      font-weight:400;
      line-height:1.2;
      margin:0 0 30px;
    }
    .how-block{
      background:var(--bg-soft);
      border-radius:4px;
      padding:48px;
      border-left:4px solid var(--gold);
    }
    .how-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:32px;
    }
    .how-grid-3{grid-template-columns:1fr 1fr 1fr;}
    @media (max-width:900px){
      .how-grid-3{grid-template-columns:1fr;}
    }
    .how-point h4{
      font-family:Arial,Helvetica,sans-serif;
      font-size:13px;
      font-weight:600;
      color:var(--gold);
      margin:0 0 8px;
      letter-spacing:.05em;
      text-transform:uppercase;
    }
    .how-point p{
      font-family:Arial,Helvetica,sans-serif;
      font-size:14px;
      color:var(--text-dim);
      line-height:1.7;
      margin:0;
    }
    @media (max-width:700px){
      .how-section{padding:0 24px 72px;}
      .how-block{padding:28px;}
      .how-grid{grid-template-columns:1fr;gap:28px;}
    }

    .ind-section{
      max-width:1200px;
      margin:0 auto;
      padding:20px 48px 110px;
    }
    .ind-section h2{
      font-size:2.6rem;
      font-weight:400;
      line-height:1.2;
      margin:0 0 30px;
    }
    .ind-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:1px;
      background:var(--line);
      border:1px solid var(--line);
      border-radius:4px;
      overflow:hidden;
    }
    .ind-row{
      display:grid;
      grid-template-columns:200px 1fr;
      background:var(--bg-soft);
      transition:background .2s;
    }
    .ind-row:hover{background:rgba(28,46,74,.9);}
    .ind-name{
      padding:18px 22px;
      border-right:1px solid var(--line);
      font-family:Arial,Helvetica,sans-serif;
      font-weight:500;
      font-size:14px;
      display:flex;
      align-items:center;
    }
    .ind-type{
      padding:18px 22px;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text-dim);
      font-size:13px;
      display:flex;
      align-items:center;
    }
    @media (max-width:900px){
      .ind-grid{grid-template-columns:1fr;}
    }
    @media (max-width:700px){
      .ind-section{padding:0 24px 72px;}
      .ind-row{grid-template-columns:140px 1fr;}
      .ind-name,.ind-type{padding:14px 16px;}
    }

    .tools-section{
      max-width:1200px;
      margin:0 auto;
      padding:20px 48px 110px;
    }
    .tools-section h2{
      font-size:2.6rem;
      font-weight:400;
      line-height:1.2;
      margin:0 0 30px;
    }
    .tools-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }
    .tool-card{
      background:var(--bg-soft);
      border:1px solid var(--line);
      border-radius:4px;
      padding:18px 22px;
      display:flex;
      flex-direction:column;
      gap:6px;
      transition:border-color .2s;
    }
    .tool-card:hover{border-color:rgba(196,151,74,.25);}
    .tool-cat{
      font-family:Arial,Helvetica,sans-serif;
      font-size:10px;
      font-weight:600;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--gold);
    }
    .tool-list{
      font-family:Arial,Helvetica,sans-serif;
      font-size:13px;
      color:var(--text-dim);
      line-height:1.5;
    }
    @media (max-width:900px){
      .tools-grid{grid-template-columns:repeat(2,1fr);}
    }
    @media (max-width:700px){
      .tools-section{padding:0 24px 72px;}
      .tools-grid{grid-template-columns:1fr;}
    }

    .certs-section{
      max-width:1200px;
      margin:0 auto;
      padding:20px 48px 110px;
    }
    .certs-section h2{
      font-size:2.6rem;
      font-weight:400;
      line-height:1.2;
      margin:0 0 30px;
    }
    .certs-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .cert{
      background:var(--bg-soft);
      border:1px solid var(--line);
      border-radius:4px;
      padding:16px 20px;
      display:flex;
      align-items:center;
      gap:12px;
      font-family:Arial,Helvetica,sans-serif;
      font-size:13px;
      transition:border-color .2s;
    }
    .cert:hover{border-color:rgba(196,151,74,.25);}
    .cert-dot{
      width:6px;
      height:6px;
      border-radius:50%;
      background:var(--gold);
      flex-shrink:0;
    }
    @media (max-width:900px){
      .certs-grid{grid-template-columns:1fr;}
    }
    @media (max-width:700px){
      .certs-section{padding:0 24px 72px;}
    }

    .contact-section{
      background:var(--bg-soft);
      text-align:center;
      padding:100px 48px 90px;
    }
    .contact-inner{max-width:560px;margin:0 auto;}
    .contact-inner .eyebrow{justify-content:center;}
    .contact-inner h2{
      font-size:2.6rem;
      font-weight:400;
      margin:20px 0 30px;
    }
    .contact-inner h2 b{font-weight:700;}
    .contact-inner p{
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text-dim);
      font-size:15px;
      margin:0 0 8px;
    }
    .contact-links{
      display:flex;
      gap:14px;
      justify-content:center;
      margin-top:36px;
      flex-wrap:wrap;
    }
    .btn-gold{
      background:var(--gold);
      color:var(--bg);
      padding:14px 30px;
      border-radius:2px;
      font-size:11px;
      font-weight:600;
      letter-spacing:.12em;
      text-transform:uppercase;
      text-decoration:none;
      transition:.2s;
      display:inline-block;
      font-family:Arial,Helvetica,sans-serif;
    }
    .btn-gold:hover{background:#d8b768;transform:translateY(-2px);}
    .btn-ghost{
      border:1px solid rgba(247,244,239,0.2);
      color:var(--text);
      padding:14px 30px;
      border-radius:2px;
      font-size:11px;
      font-weight:400;
      letter-spacing:.12em;
      text-transform:uppercase;
      text-decoration:none;
      transition:.2s;
      display:inline-block;
      font-family:Arial,Helvetica,sans-serif;
    }
    .btn-ghost:hover{border-color:var(--text);transform:translateY(-2px);}
    .site-footer{
      background:var(--bg);
      border-top:1px solid var(--line);
      text-align:center;
      padding:22px;
      font-size:12px;
      color:var(--text-dim);
      letter-spacing:.04em;
      font-family:Arial,Helvetica,sans-serif;
    }
    @media (max-width:700px){
      .contact-section{padding:64px 24px 56px;}
      .contact-inner h2{font-size:2rem;}
    }
  </style>
</head>
<body>

  <div class="nav">
    <div class="brand">Natali Ghibradze</div>
    <div class="links">
      <a href="#about-me">About</a>
      <a href="#case-studies">Case Studies</a>
      <a href="#systems">Systems</a>
      <a href="#approach">Approach</a>
      <a href="#industries">Industries</a>
      <a href="#tools">Tools</a>
      <a href="#contact">Contact</a>
    </div>
    <a href="Natali_Ghibradze_Resume.pdf" target="_blank" class="resume-btn">Resume</a>
  </div>

  <section class="hero">
    <div class="hero-text">
      <div class="eyebrow"><span class="rule"></span> Enterprise Customer Success Manager</div>
      <h1 class="name">Natali<span class="last">Ghibradze</span></h1>
      <div class="subline">Mid-Market &amp; Upmarket CSM &nbsp;·&nbsp; B2B &nbsp;·&nbsp; $1.5M ARR Portfolio</div>
      <div class="subline langs">Europe + Eastern Europe &nbsp;·&nbsp; Trilingual: EN / RUS / ZH</div>
      <div class="cta-row">
        <a href="#case-studies" class="btn primary">View Case Studies</a>
        <a href="#about-me" class="btn">About Me</a>
        <a href="Natali_Ghibradze_Resume.pdf" target="_blank" class="btn">Download Resume</a>
      </div>
